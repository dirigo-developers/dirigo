repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        name: Check Python lint

      - id: ruff-format
        name: Check Python formatting
        args: [--check]
  - repo: local
    hooks:
      - id: ty
        name: Check Python types
        entry: ty check
        language: system
        pass_filenames: false
        always_run: true
    