[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "dirigo"
version = "0.4.0"
description = "Dirigo is an extensible backend for scientific image acquisition"
authors = [
    {name = "Timothy D. Weber", email = "tweber@mit.edu"}
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy",
    "numba",
    "scipy",
    "toml",
    "platformdirs",
    "tifffile",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/dirigo-developers/dirigo"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "PT",   # pytest style
    "RUF",  # Ruff-specific
    "N",    # pep8-naming
    "NPY",  # numpy
    "PERF", # perflint
    "E302", # two blank lines between top-level classes and functions
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=dirigo --cov-report=term-missing --import-mode=importlib"

[tool.ty.environment]
python-version = "3.14"